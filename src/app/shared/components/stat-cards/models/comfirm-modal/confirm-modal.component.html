@if (isOpen) {
<div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[100] transition-opacity duration-300 flex items-center justify-center p-4">
  
  <div class="bg-white rounded-[28px] shadow-2xl w-full max-w-md transform overflow-hidden transition-all animate-in fade-in zoom-in duration-200">
    
    <div class="p-8">
      <div class="flex items-start gap-4">
        
        @if (type === 'danger') {
          <div class="w-12 h-12 rounded-2xl bg-red-100 text-red-600 flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined text-2xl">delete_forever</span>
          </div>
        } @else if (type === 'warning') {
          <div class="w-12 h-12 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined text-2xl">warning</span>
          </div>
        } @else {
          <div class="w-12 h-12 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined text-2xl">info</span>
          </div>
        }

        <div class="flex-1">
          <h3 class="text-xl font-bold text-gray-900">{{ title }}</h3>
          <p class="text-sm text-gray-600 mt-2 leading-relaxed">
            {{ message }}
          </p>
        </div>
      </div>
    </div>

    <div class="bg-gray-50 p-6 flex gap-3 justify-end rounded-b-[28px]">
      <button 
        (click)="onCancel()"
        class="px-6 py-2.5 text-sm font-semibold text-gray-600 rounded-xl hover:bg-gray-100 transition-colors active:scale-95">
        {{ cancelText }}
      </button>
      <button 
        (click)="onConfirm()"
        class="px-6 py-2.5 text-sm font-semibold rounded-xl text-white transition-all active:scale-95 shadow-md shadow-red-200"
        [ngClass]="{
          'bg-red-600 hover:bg-red-700': type === 'danger',
          'bg-amber-600 hover:bg-amber-700': type === 'warning',
          'bg-blue-600 hover:bg-blue-700': type === 'info'
        }">
        {{ confirmText }}
      </button>
    </div>
    
  </div>
</div>
}
