 

<div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4"
     [ngClass]="stats.length === 3 ? 'lg:grid-cols-3' : 'lg:grid-cols-4'">
  
  <div *ngFor="let item of stats" 
       class="bg-white rounded-2xl border border-gray-200 p-5 flex items-center gap-4 hover:shadow-md transition-all cursor-default group">
    
    <div [class]="item.bgColor" 
         class="w-14 h-14 rounded-xl flex items-center justify-center transition-transform group-hover:scale-110">
      <span [class]="item.textColor" class="material-symbols-outlined text-3xl">
        {{ item.icon }}
      </span>
    </div>

    <div class="flex flex-col">
      <p class="text-sm font-medium text-gray-500 mb-0.5">{{ item.label }}</p>
      <p class="text-2xl font-bold text-gray-800 tracking-tight">
        {{ item.value }}
      </p>
    </div>
  </div>
</div>
