<!-- 🌟 เปลี่ยนจาก grid-cols-1 เป็น grid-cols-2 และลดช่องว่าง (gap) บนมือถือ -->
<div class="grid grid-cols-2 gap-3 sm:gap-4 pb-4"
     [ngClass]="stats.length === 3 ? 'lg:grid-cols-3' : 'lg:grid-cols-4'">

  <div *ngFor="let item of stats"
       [class]="item.cardBg || 'bg-white'"
       class="shadow-sm hover:shadow-md rounded-2xl border border-gray-100 p-3 sm:p-6 flex items-center gap-2.5 sm:gap-4 transition-all cursor-default group">

    <!-- 🌟 ย่อขนาดไอคอนบนมือถือให้เล็กลง (w-10 h-10) พอจอคอมค่อยขยายใหญ่ (sm:w-14 sm:h-14) -->
    <div [class]="item.bgColor"
         class="w-10 h-10 sm:w-14 sm:h-14 rounded-xl flex items-center justify-center transition-transform group-hover:scale-110 shrink-0">
      <span [class]="item.textColor" class="material-symbols-outlined icon-filled text-lg sm:text-3xl">
        {{ item.icon }}
      </span>
    </div>

    <!-- 🌟 ย่อขนาดข้อความ เพื่อให้พอดีกับกรอบ 2 คอลัมน์บนมือถือ -->
    <div class="flex flex-col min-w-0">
      <p class="text-[10px] sm:text-sm font-medium text-gray-500 mb-0.5 truncate">{{ item.label }}</p>

      <!-- จับคำว่า "คน" มาแยกขนาดตัวอักษรให้ดูโปรขึ้น -->
      <p class="text-sm sm:text-2xl font-bold text-gray-800 tracking-tight leading-none mt-0.5">
        {{ item.value }} <span class="text-[9px] sm:text-base font-medium text-gray-500 ml-0.5">คน</span>
      </p>
    </div>

  </div>
</div>
