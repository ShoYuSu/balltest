<div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4"
     [ngClass]="stats.length === 3 ? 'lg:grid-cols-3' : 'lg:grid-cols-4'">

  <div *ngFor="let item of stats"
       [class]="item.cardBg || 'bg-white'"
       class="shadow-[0_0_15px_rgba(0,0,0,0.08)]  rounded-2xl border border-gray-200 p-4 sm:p-7 flex items-center gap-3 sm:gap-4  transition-all cursor-default group">

    <div [class]="item.bgColor"
         class="w-11 h-11 sm:w-14 sm:h-14 rounded-xl flex items-center justify-center transition-transform group-hover:scale-110 shrink-0">
      <span [class]="item.textColor" class="material-symbols-outlined icon-filled text-xl sm:text-3xl">
        {{ item.icon }}
      </span>
    </div>

    <div class="flex flex-col min-w-0">
      <p class="text-xs sm:text-sm font-medium text-gray-500 mb-0.5 truncate">{{ item.label }}</p>
      <p class="text-lg sm:text-2xl font-bold text-gray-800 tracking-tight">
        {{ item.value }} คน
      </p>
    </div>
  </div>
</div>
