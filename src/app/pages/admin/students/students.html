<div class="bg-white rounded-3xl border border-gray-100 p-8 shadow-sm mb-6">
  <div class="justify-center w-full mb-10">
    <app-stat-cards [stats]="studentStats"></app-stat-cards>
  </div>

  <div class="flex flex-wrap items-center justify-between gap-4 my-6">
    <div class="relative flex-1 min-w-[300px] max-w-md">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">search</span>
      <input type="text" [(ngModel)]="searchText" placeholder="ค้นหานักศึกษา (ชื่อหรือรหัส)..." 
             class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-sm shadow-sm">
    </div>

    <div class="flex items-center gap-3">
      <button (click)="isCurriculumModalOpen = true" 
              class="flex items-center gap-2 px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm font-medium text-gray-700 hover:bg-gray-50 hover:border-blue-200 transition-all shadow-sm">
        <span class="material-symbols-outlined text-lg text-blue-600">menu_book</span> 
        โครงสร้างหลักสูตร
      </button>

      <app-main-button (btnClick)="openModal()"></app-main-button>
    </div>
  </div>
</div>

<app-curriculum-management 
  *ngIf="isCurriculumModalOpen" 
  [isOpen]="isCurriculumModalOpen"
  (close)="isCurriculumModalOpen = false">
</app-curriculum-management>

<div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-6">
  <table class="w-full text-left border-collapse">
    <thead>
      <tr class="bg-gray-50 border-b border-gray-100">
        <th *ngFor="let col of columns" class="p-4 text-xs font-bold text-gray-500 uppercase">
          {{ col.header }}
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let s of filteredStudents" class="border-b border-gray-50 hover:bg-blue-50/20 transition-colors">
        <td *ngFor="let col of columns" class="p-4 text-sm">
          
          <div *ngIf="col.tag === 'image'" class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center overflow-hidden border">
            <img *ngIf="col.cell(s)" [src]="col.cell(s)" class="w-full h-full object-cover">
            <span *ngIf="!col.cell(s)" class="material-symbols-outlined text-blue-300">person</span>
          </div>

          <span *ngIf="col.tag === 'text'" class="text-gray-700">{{ col.cell(s) }}</span>

          <button *ngIf="col.tag === 'edit'" (click)="editStudent(s)" class="text-blue-500     hover:text-blue-600 ">
  <span class="material-symbols-outlined">edit</span>
</button>
          <button *ngIf="col.tag === 'delete'" (click)="deleteStudent(s)" class="text-red-500 hover:text-red-600 ml-2">
            <span class="material-symbols-outlined">delete</span>
          </button>
        </td>
      </tr>
      <tr *ngIf="filteredStudents.length === 0">
        <td [attr.colspan]="columns.length" class="p-10 text-center text-gray-400 text-sm italic">ไม่พบข้อมูลนักศึกษา</td>
      </tr>
    </tbody>
  </table>
</div>

<div *ngIf="isModalOpen" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 ">
  <div class="bg-white rounded-[16px] shadow-2xl w-full h-full max-w-[450px] overflow-y-auto transform transition-all">
    <div class="p-6 pb-0 flex justify-between items-start">
      <h3 class="text-xl font-bold text-gray-800">
  {{ isEditMode ? 'แก้ไขข้อมูลนักศึกษา' : 'เพิ่มนักศึกษาใหม่' }}
</h3>
      <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <form [formGroup]="studentForm" (ngSubmit)="saveStudent()" class="p-8 pt-4 space-y-4 text-left">
  
  <div class="flex flex-col items-center">
  <div class="relative">
    <div class="w-24 h-24 rounded-full flex items-center justify-center border-4 border-white/80 overflow-hidden shadow-[0_10px_30px_rgba(0,0,0,0.1)] backdrop-blur-sm">
  
  <img *ngIf="imagePreview" 
       [src]="imagePreview" 
       class="w-full h-full object-cover animate-in fade-in duration-500">
  
  <div *ngIf="!imagePreview" class="w-full h-full bg-blue-500/10 flex items-center justify-center">
    <span class="material-symbols-outlined text-4xl text-blue-300">person_outline</span>
  </div>
</div>

    <button type="button" (click)="fileInput.click()" 
            class="absolute bottom-0 right-0 bg-white/70 text-blue-600 w-8 h-8 rounded-full shadow-md backdrop-blur-lg flex items-center justify-center border border-white/50 hover:bg-white hover:scale-110 active:scale-95 transition-all">
      <span class="material-symbols-outlined text-sm leading-none">edit</span>
    </button>
  </div>
  
  <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" class="hidden">
  <p class="mt-2 text-xs font-semibold text-gray-500 hover:text-blue-600 transition-colors">รูปนักศึกษา</p>
</div>

  <div class="grid grid-cols-1 gap-4">
    <div class="space-y-1">
      <label class="text-xs font-semibold text-gray-600 uppercase">รหัสนักศึกษา</label>
      <input type="text" formControlName="student_code" placeholder="เช่น 650000000"
             class="w-full p-2.5 bg-gray-50 border rounded-xl outline-none transition-all focus:ring-2 focus:ring-blue-500/10" 
             [ngClass]="submitted && studentForm.get('student_code')?.invalid ? 'border-red-500 bg-red-50' : 'border-gray-200 focus:border-blue-400'">
      <p *ngIf="submitted && studentForm.get('student_code')?.invalid" class="text-[10px] text-red-500 font-medium">
        * กรุณากรอกรหัสนักศึกษา (ตัวเลขเท่านั้น)
      </p>
    </div>

    <div class="space-y-1">
      <label class="text-xs font-semibold text-gray-600 uppercase">ชื่อ-สกุล</label>
      <input type="text" formControlName="full_name" placeholder="ชื่อ นามสกุล"
             class="w-full p-2.5 bg-gray-50 border rounded-xl outline-none transition-all focus:ring-2 focus:ring-blue-500/10" 
             [ngClass]="submitted && studentForm.get('full_name')?.invalid ? 'border-red-500 bg-red-50' : 'border-gray-200 focus:border-blue-400'">
      <p *ngIf="submitted && studentForm.get('full_name')?.invalid" class="text-[10px] text-red-500 font-medium">
        * กรุณากรอกชื่อ-นามสกุล
      </p>
    </div>
    <div class="space-y-1">
  <label class="text-xs font-semibold text-gray-600 uppercase">อีเมล</label>
  <input type="email" formControlName="email" placeholder="example@siam.edu"
         class="w-full p-2.5 bg-gray-50 border rounded-xl outline-none transition-all focus:ring-2 focus:ring-blue-500/10" 
         [ngClass]="submitted && studentForm.get('email')?.invalid ? 'border-red-500 bg-red-50' : 'border-gray-200 focus:border-blue-400'">
  <p *ngIf="submitted && studentForm.get('email')?.invalid" class="text-[10px] text-red-500 font-medium">
    * กรุณากรอกอีเมลที่ถูกต้อง
  </p>
</div>
<div class="space-y-1">
  <label class="text-xs font-semibold text-gray-600 uppercase">คณะ</label>
  <input type="text" formControlName="faculty" placeholder="ระบุคณะ"
         class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-400">
</div>
  </div>

  
    <div class="space-y-1 relative">
  <label class="text-xs font-semibold text-gray-600 uppercase">สาขา</label>
  <div class="relative">
    <button type="button" (click)="toggleMajorDropdown()"
            class="w-full flex items-center justify-between p-2.5 bg-gray-50 border rounded-2xl transition-all text-sm font-medium"
            [ngClass]="submitted && studentForm.get('major')?.invalid ? 'border-red-500' : 'border-gray-200 text-gray-700'">
      <span>{{ studentForm.get('major')?.value || 'เลือกสาขา' }}</span>
      <span class="material-symbols-outlined text-gray-400" [class.rotate-180]="isMajorDropdownOpen">expand_more</span>
    </button>

    <div *ngIf="isMajorDropdownOpen" class="absolute z-30 w-full mt-2 bg-white border rounded-[20px] shadow-xl overflow-hidden animate-in fade-in zoom-in duration-150">
      <ul class="p-2 text-sm max-h-48 overflow-y-auto">
        <li *ngFor="let m of majors">
          <button type="button" (click)="selectMajor(m)" class="w-full text-left p-2.5 hover:bg-blue-50 rounded-xl transition-colors">{{ m }}</button>
        </li>
      </ul>
      <div class="p-2 border-t bg-gray-50/50 flex gap-2">
        <input type="text" [(ngModel)]="newMajorName" [ngModelOptions]="{standalone: true}" placeholder="เพิ่มสาขาใหม่..."
               class="flex-1 px-3 py-2 text-xs border rounded-lg outline-none focus:border-blue-400 bg-white">
        <button type="button" (click)="addNewMajor()" class="px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
          <span class="material-symbols-outlined text-sm">add</span>
        </button>
      </div>
    </div>
  </div>
</div>
  
  <div class="grid grid-cols-2 gap-4">
   
      <div class="space-y-1 relative">
  <label class="text-xs font-semibold text-gray-600 uppercase">ชั้นปี</label>
  
  <div class="relative">
    <button type="button" 
            (click)="toggleYearDropdown()"
            class="w-full flex items-center justify-between p-2.5 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500/10 focus:border-blue-400 transition-all text-sm font-medium text-gray-700">
      <span>ปี {{ studentForm.get('year')?.value }}</span>
      <span class="material-symbols-outlined text-gray-400 transition-transform" 
            [class.rotate-180]="isYearDropdownOpen">expand_more</span>
    </button>

    <div *ngIf="isYearDropdownOpen" 
         class="absolute z-20 w-full mt-2 bg-white border border-gray-100 rounded-[20px] shadow-xl overflow-hidden animate-in fade-in zoom-in duration-150">
      <ul class="p-2 text-sm text-gray-700 font-medium">
        <li *ngFor="let y of [1,2,3,4]">
          <button type="button" 
                  (click)="selectYear(y)"
                  class="flex items-center w-full p-2.5 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition-colors">
            ชั้นปีที่ {{ y }}
          </button>
        </li>
      </ul>
    </div>
  </div>
</div>
      </div>

      <div class="flex gap-4 pt-10">
        <button type="button" (click)="closeModal()" class="flex-1 py-3 border border-gray-200 rounded-xl font-bold text-gray-400 hover:bg-gray-50 transition-all">ยกเลิก</button>
        <button type="submit" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all">
  {{ isEditMode ? 'ยืนยันการแก้ไข' : 'บันทึกข้อมูล' }}
</button>
      </div>
    </form>
  </div>
</div>
<app-confirm-modal
  [isOpen]="isDeleteModalOpen"
  title="ยืนยันการลบข้อมูล"
  message="คุณแน่ใจใช่ไหมที่จะลบข้อมูลนักศึกษาคนนี้? การดำเนินการนี้ไม่สามารถย้อนกลับได้"
  confirmText="ลบข้อมูล"
  cancelText="ยกเลิก"
  type="danger"
  (confirm)="confirmDelete()"
  (cancel)="cancelDelete()">
</app-confirm-modal>
