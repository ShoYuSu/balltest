<div class="min-h-screen bg-gray-50 p-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">จัดการผู้ใช้งาน (นักศึกษา)</h1>
    <!-- <app-main-button label="สร้างบัญชีผู้ใช้" (btnClick)="openAddModal()"></app-main-button> -->
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead class="bg-gray-50 border-b border-gray-100">
        <tr>
          <ng-container *ngFor="let col of columns">
            <th *ngIf="col.display" 
                [style.width]="col.width === 'small' ? '80px' : col.width === 'medium' ? '180px' : 'auto'"
                class="p-4 font-semibold text-gray-600 text-sm">
              {{ col.header }}
            </th>
          </ng-container>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let user of users" class="border-b border-gray-50 hover:bg-gray-50 transition">
          <ng-container *ngFor="let col of columns">
            <td *ngIf="col.display" class="p-4 text-sm">
              
              <ng-container [ngSwitch]="col.tag">
                
                <span *ngSwitchCase="'text'" class="text-gray-700">
                  {{ col.cell(user) }}
                </span>

                <div *ngSwitchCase="'badge'">
                  <span class="px-3 py-1 rounded-full text-xs bg-green-100 text-green-600 font-medium">
                    {{ col.cell(user) }}
                  </span>
                </div>

                <div *ngSwitchCase="'manage'" class="text-gray-400 cursor-pointer hover:text-indigo-600 transition-colors">
                  <span class="material-symbols-outlined">more_horiz</span>
                </div>

                <span *ngSwitchDefault>{{ col.cell(user) }}</span>

              </ng-container>
            </td>
          </ng-container>
        </tr>

        <tr *ngIf="users.length === 0">
          <td [attr.colspan]="columns.length" class="p-12 text-center text-gray-400">
            <div class="flex flex-col items-center gap-2">
              <span class="material-symbols-outlined text-4xl">person_search</span>
              <p>ไม่พบข้อมูลผู้ใช้งานนักศึกษา</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="isModalOpen" 
       class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4"
       (click)="isStudentDropdownOpen = false">
    
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200"
         (click)="$event.stopPropagation()">
      
      <div class="p-6 pb-0 flex justify-between items-center">
        <h3 class="text-xl font-bold text-gray-800">สร้างบัญชีผู้ใช้งานใหม่</h3>
        <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl transition-colors">&times;</button>
      </div>

      <form [formGroup]="userForm" (ngSubmit)="saveUser()" class="p-6 space-y-4">
        
        <div class="space-y-1 text-left relative">
          <label class="text-sm font-semibold text-gray-700">เลือกนักศึกษา</label>
          
          <button type="button" (click)="toggleStudentDropdown()"
                  class="w-full p-2.5 border rounded-xl flex justify-between items-center bg-white transition-all outline-none"
                  [ngClass]="(submitted && userForm.get('person_id')?.invalid) ? 'border-red-500' : 'border-gray-200 focus:border-indigo-400'">
            <span [class.text-gray-400]="!selectedStudentName">
              {{ selectedStudentName || '-- กรุณาเลือกนักศึกษา --' }}
            </span>
            <svg class="w-5 h-5 text-gray-400 transition-transform duration-200" 
                 [class.rotate-180]="isStudentDropdownOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>

          <div *ngIf="isStudentDropdownOpen" 
               class="absolute z-30 w-full mt-2 bg-white border border-gray-100 rounded-[20px] shadow-xl overflow-hidden animate-in fade-in slide-in-from-top-2 duration-150">
            <ul class="max-h-60 overflow-y-auto p-2 text-sm text-gray-700 font-medium">
              <li *ngFor="let std of studentsNoUser">
                <button type="button" 
                        (click)="selectStudent(std)"
                        class="flex flex-col items-start w-full p-2.5 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition-colors text-left">
                  <span class="font-bold text-indigo-600">{{ std.student_code }}</span>
                  <span class="text-gray-600">{{ std.full_name }}</span>
                </button>
              </li>
              <li *ngIf="studentsNoUser.length === 0" class="p-4 text-center text-gray-400 text-xs">
                ไม่พบนักศึกษาที่ยังไม่มีบัญชี
              </li>
            </ul>
          </div>
          <p *ngIf="submitted && userForm.get('person_id')?.invalid" class="text-red-500 text-xs mt-1">กรุณาเลือกนักศึกษา</p>
        </div>

        <div class="space-y-1 text-left">
          <label class="text-sm font-semibold text-gray-700">ชื่อผู้ใช้งาน (ใช้อีเมลนักศึกษา)</label>
          <input type="email" formControlName="email" 
                 class="w-full p-2.5 border border-gray-200 rounded-xl bg-gray-50 text-gray-400 cursor-not-allowed outline-none">
        </div>

        <div class="space-y-1 text-left">
          <label class="text-sm font-semibold text-gray-700">รหัสผ่านสำหรับเข้าใช้งาน</label>
          <input type="password" formControlName="password" placeholder="ตั้งรหัสผ่าน 6 ตัวขึ้นไป"
                 class="w-full p-2.5 border border-gray-200 rounded-xl outline-none focus:border-indigo-400 transition"
                 [ngClass]="{'border-red-500': submitted && userForm.get('password')?.invalid}">
          <p *ngIf="submitted && userForm.get('password')?.invalid" class="text-red-500 text-xs mt-1">รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร</p>
        </div>

        <div class="flex gap-3 pt-4">
          <button type="button" (click)="closeModal()" 
                  class="flex-1 py-2.5 border border-gray-300 rounded-xl font-semibold text-gray-600 hover:bg-gray-50 transition">ยกเลิก</button>
          <button type="submit" 
                  class="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition shadow-sm">
            ยืนยันการสร้างบัญชี
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
