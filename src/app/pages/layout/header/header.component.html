<header class="bg-white border-b border-gray-200 px-6 h-[70px] flex justify-end items-center shadow-sm relative">
  <div class="relative">
    <button
      (click)="toggleDropdown()"
      class="flex items-center gap-3 p-1 rounded-full hover:bg-gray-100 transition duration-200"
    >
      <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white font-bold shadow-md border-2 border-white shrink-0">
        <!-- เช็คว่ามีชื่อไหม (เอาตัวอักษรแรกมาโชว์ก็ได้นะพี่ ถ้าอยากให้เฟี้ยว) -->
        @if (userName !== 'ผู้ใช้งาน') {
          {{ userName.charAt(0) }}
        } @else {
          <span class="material-symbols-outlined">person</span>
        }
      </div>

      <div class="hidden md:flex items-center flex-col">
        <span class="text-sm font-semibold text-gray-700 whitespace-nowrap">
          {{ userName || 'Loading...' }}
        </span>

        @if (userRole === 'teacher' || userRole === 'advisor') {
          <span class="text-[12px] text-blue-600 font-bold rounded-full ">
            อาจารย์ที่ปรึกษา
          </span>
        } @else if (userRole === 'student') {
          <span class="text-[12px] text-blue-600 font-bold rounded-full ">
           รหัสนักศึกษา {{ studentCode || 'N/A' }}
          </span>
        } @else if (userRole === 'admin') {
          <span class="text-[12px] text-blue-600 font-bold rounded-full ">
           ผู้ดูแลระบบ
          </span>
        }
      </div>

      <span
        class="material-symbols-outlined text-gray-400 text-sm transition-transform duration-300"
        [class.rotate-180]="isDropdownOpen"
      >
        expand_more
      </span>
    </button>

    @if (isDropdownOpen) {
      <div class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-gray-100 py-2 z-50 animate-in fade-in zoom-in duration-200">
        <div class="px-4 py-2 border-b border-gray-50 mb-1">
          <p class="text-xs text-gray-400">บัญชีผู้ใช้</p>
          <p class="text-sm font-bold text-gray-800 truncate">{{ userName }}</p>
        </div>

        <button
          (click)="onLogout()"
          class="w-full flex items-center gap-3 px-4 py-2 text-sm text-red-500 hover:bg-red-50 transition font-medium"
        >
          <span class="material-symbols-outlined text-lg">logout</span> ออกจากระบบ
        </button>
      </div>

      <div class="fixed inset-0 z-40" (click)="toggleDropdown()"></div>
    }
  </div>
</header>
